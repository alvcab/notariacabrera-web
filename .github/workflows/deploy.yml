name: Deploy to hosting via FTP

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PDF de los registros del Conservador: van fuera de public_html, para que solo se puedan abrir
      # a través de documento.php (con sesión iniciada). Se suben antes que el sitio, que los saca de public_html.
      - name: Documentos protegidos (fuera de public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./assets/documents/
          server-dir: ./domains/notariacabrera.cl/privado/documentos/
          exclude: |
            informe-fiscalizacion.pdf
            declaracion-de-intereses.png

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./domains/notariacabrera.cl/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            CNAME
            redirect-subdominio/**
            scripts/**
            .claude/**
            assets/documents/accionistas/**
            assets/documents/descubrimientos/**
            assets/documents/hipotecas/**
            assets/documents/prohibiciones/**
            assets/documents/propiedad/**

      # El sitio vive en notariacabrera.cl; el subdominio antiguo solo redirige allá.
      # Al sincronizar esta carpeta (que solo tiene el .htaccess) se borran los archivos viejos del subdominio.
      - name: Redirigir 2.notariacabrera.cl al dominio principal
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./redirect-subdominio/
          server-dir: ./domains/2.notariacabrera.cl/public_html/
