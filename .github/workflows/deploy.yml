name: Deploy to hosting via FTP

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./domains/notariacabrera.cl/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            CNAME
            redirect-subdominio/**
            scripts/**

      # El sitio vive en notariacabrera.cl; el subdominio antiguo solo redirige allá.
      # Al sincronizar esta carpeta (que solo tiene el .htaccess) se borran los archivos viejos del subdominio.
      - name: Redirigir 2.notariacabrera.cl al dominio principal
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./redirect-subdominio/
          server-dir: ./domains/2.notariacabrera.cl/public_html/
